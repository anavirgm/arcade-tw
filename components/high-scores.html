<section class="relative bg-black/80 py-20">
    <div class="container mx-auto px-4">
        <h2 class="pixel-text text-3xl text-center text-white mb-12">HIGH SCORES</h2>
        <p class="pixel-text text-xl text-center text-white mb-8">Los clásicos nunca mueren. Revive la emoción de los récords legendarios.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="high-scores-container">
            <div class="border-2 border-purple-500 bg-black p-6 rounded-lg text-white hover:border-purple-400 transition-all" style="animation-delay:0s">
                <!-- PACMAN -->
                <h3 class="pixel-text text-lg mb-4">Pac-Man</h3>
                <div class="space-y-2 text-sm">
                    <p class="flex justify-between"><span>Player:</span><span class="text-purple-400">Ana Mota</span></p>
                    <p class="flex justify-between"><span>High Score:</span><span class="text-purple-400">99,999</span></p>
                </div>
            </div>
            <!-- SPACE INVADERS -->
            <div class="border-2 border-purple-500 bg-black p-6 rounded-lg text-white hover:border-purple-400 transition-all" style="animation-delay:0.2s">
                <h3 class="pixel-text text-lg mb-4">Space Invaders</h3>
                <div class="space-y-2 text-sm">
                    <p class="flex justify-between"><span>Player:</span><span class="text-purple-400">Jesús Apolinar</span></p>
                    <p class="flex justify-between"><span>High Score:</span><span class="text-purple-400">88,888</span></p>
                </div>
            </div>
            <!-- DONKEY KONG -->
            <div class="border-2 border-purple-500 bg-black p-6 rounded-lg text-white hover:border-purple-400 transition-all" style="animation-delay:0.4s">
                <h3 class="pixel-text text-lg mb-4">Donkey Kong</h3>
                <div class="space-y-2 text-sm">
                    <p class="flex justify-between"><span>Player:</span><span class="text-purple-400">Isabel Diaz</span></p>
                    <p class="flex justify-between"><span>High Score:</span><span class="text-purple-400">77,777</span></p>
                </div>
            </div>
            <!-- BOMBERMAN -->
            <div class="border-2 border-purple-500 bg-black p-6 rounded-lg text-white hover:border-purple-400 transition-all" style="animation-delay:0.6s">
                <h3 class="pixel-text text-lg mb-4">Bomberman</h3>
                <div class="space-y-2 text-sm">
                    <p class="flex justify-between"><span>Player:</span><span class="text-purple-400">Antonio Villalobos</span></p>
                    <p class="flex justify-between"><span>High Score:</span><span class="text-purple-400">66,666</span></p>
                </div>
            </div>
        </div>

        <!-- Botón Ver más centrado -->
        <div class="flex justify-center mt-8">
            <button id="btn-mostrar-mas" class="start-button text-white pulse" onclick="mostrarMas()">Ver más</button>
        </div>
    </div>
</section>
