<!DOCTYPE html>
<html lang="es">

<head>
    <meta charSet="utf-8" />
    <link rel="stylesheet" href="styles.css" data-precedence="next" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/images/cohete.ico" type="image/x-icon" sizes="any" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/styles.css" />
</head>


<body class="antialiased">
    <div class="min-h-screen space-background relative">
        <div id="hero-component"></div>
        <div id="high-scores-component"></div>

        <section class="relative bg-purple-900/20 py-20">
            <div class="container mx-auto px-4">
                <h2 class="pixel-text text-3xl text-center text-white mb-12">CARACTERÍSTICAS</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

                    <!-- TORNEOS -->
                    <div class="text-center p-6">
                        <!-- IMAGEN DEL TROFEO -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="w-12 h-12 mx-auto mb-4 text-yellow-400">
                            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                            <path d="M4 22h16"></path>
                            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
                        </svg>

                        <h3 class="pixel-text text-white mb-2">TORNEOS</h3>
                        <p class="text-purple-200">Compite por las puntuaciones más altas en torneos semanales</p>
                    </div>

                    <!-- MULTIJUGADOR -->
                    <div class="text-center p-6">
                        <!-- IMAGEN DEL MULTIJUGADOR -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="w-12 h-12 mx-auto mb-4 text-blue-400">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>

                        <h3 class="pixel-text text-white mb-2">MULTIJUGADOR</h3>
                        <p class="text-purple-200">Conecta con jugadores de todo el mundo</p>
                    </div>

                    <!-- LOGROS -->
                    <div class="text-center p-6">
                        <!-- IMAGEN DE LOGROS -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="w-12 h-12 mx-auto mb-4 text-purple-400">
                            <path
                                d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z">
                            </path>
                            <path d="M5 3v4"></path>
                            <path d="M19 17v4"></path>
                            <path d="M3 5h4"></path>
                            <path d="M17 19h4"></path>
                        </svg>

                        <h3 class="pixel-text text-white mb-2">LOGROS</h3>
                        <p class="text-purple-200">Desbloquea recompensas y distintivos especiales</p>
                    </div>
                </div>
            </div>
        </section>

        <div id="unete-component"></div>
        <div id="footer-component"></div>
    </div>

    <script type="module">
        import './scripts/high-scores.js';

        async function loadComponent(id, file) {
            const res = await fetch(file);
            document.getElementById(id).innerHTML = await res.text();
        }

        async function init() {
            await Promise.all([
                loadComponent('hero-component', 'components/hero.html'),
                loadComponent('high-scores-component', 'components/high-scores.html'),
                loadComponent('unete-component', 'components/unete.html'),
                loadComponent('footer-component', 'components/footer.html')
            ]);
        }

        init();
    </script>
</body>

</html>
